# Friday on a server. Three containers:
#   friday  - core (API/UI/brain/voice). Published ONLY on 127.0.0.1:4317; put `tailscale serve` (HTTPS, tailnet-only) in front.
#   agent   - DeepSeek Harness runner. Internal network only (no inbound, no direct internet); no Friday data inside.
#   proxy   - the only way out for the agent: blocks private/LAN/tailnet/docker/metadata addresses.
# Data (DB, token, voice models) lives in ${FRIDAY_DATA} on the host SSD.  Start: docker compose up -d --build
name: friday
x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  friday:
    <<: *hardening
    build: { context: ., dockerfile: deploy/Dockerfile.core }
    image: friday-core:local
    env_file: [.env]
    environment:
      FRIDAY_RESOURCE_PROFILE: server6g
      FRIDAY_WORKER_CONCURRENCY: "2"
      FRIDAY_AGENT_URL: http://agent:4320
      FRIDAY_AGENT_SECRET: ${FRIDAY_AGENT_SECRET:?set FRIDAY_AGENT_SECRET in .env}
      FRIDAY_PUBLIC_PORT: "4318"   # internet listener: NOT published on the host; only the tunnel container reaches it
      FRIDAY_DEPLOYER_URL: http://deployer:4330
      FRIDAY_DEPLOYER_SECRET: ${FRIDAY_DEPLOYER_SECRET:-}
      TZ: ${TZ:-Asia/Kolkata}
    volumes: ["${FRIDAY_DATA:-./data}:/data"]
    tmpfs: ["/tmp:size=512m,exec"]   # espeak (Kokoro) is extracted to /tmp and dlopen()ed
    ports: ["127.0.0.1:4317:4317"]
    networks: [agentnet, egress, deploynet]
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    cpus: 4

  agent:
    <<: *hardening
    build: { context: ., dockerfile: deploy/Dockerfile.agent }
    image: friday-agent:local
    environment:
      FRIDAY_AGENT_SECRET: ${FRIDAY_AGENT_SECRET:?set FRIDAY_AGENT_SECRET in .env}
      FRIDAY_NVIDIA_API_KEY: ${FRIDAY_NVIDIA_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AGENT_MAX_CONCURRENT: "2"
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      AGENT_NODE_OPTIONS: --require /srv/runner/agent-runner/proxy-preload.cjs
      TZ: ${TZ:-Asia/Kolkata}
    volumes: ["agent-home:/agent/home", "agent-work:/agent/work", "agent-state:/agent/state"]
    tmpfs: ["/tmp:size=1g,exec"]   # DSH copies its native addon into /tmp and dlopen()s it: docker tmpfs is noexec by default
    networks: [agentnet]
    depends_on: [proxy]
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 512
    cpus: 4

  proxy:
    <<: *hardening
    build: { context: ., dockerfile: deploy/Dockerfile.proxy }
    image: friday-proxy:local
    networks: [agentnet, egress]
    mem_limit: 128m
    pids_limit: 128

  # Hosts Friday's own apps on the tailnet. Has the Docker + tailscaled sockets, so its API is tiny and fixed
  # (deployer/server.mjs): only containers labelled friday.app, unprivileged apps, 127.0.0.1 ports, tailnet-only.
  deployer:
    <<: *hardening
    build: { context: ., dockerfile: deploy/Dockerfile.deployer }
    image: friday-deployer:local
    profiles: ["apps"]
    environment:
      DEPLOYER_SECRET: ${FRIDAY_DEPLOYER_SECRET:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      - agent-work:/work:ro          # the coding agent's project folders (read-only)
    cap_add: [DAC_READ_SEARCH]       # read the agent's 0700 project folders; nothing else
    networks: [deploynet, apps]
    mem_limit: 192m
    pids_limit: 128

  # Public domain via Cloudflare Tunnel (outbound only; no open ports). Starts only with COMPOSE_PROFILES=public
  # and CLOUDFLARE_TUNNEL_TOKEN in .env. Public hostname in Cloudflare: https://fridayy.site -> http://friday:4318
  tunnel:
    <<: *hardening
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["public"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [egress]
    depends_on: [friday]
    mem_limit: 128m
    pids_limit: 64

networks:
  deploynet: { internal: true }  # core <-> deployer only
  apps: { name: friday_apps }    # Friday's hosted apps (+ the deployer for health checks)
  agentnet: { internal: true }   # agent <-> core <-> proxy; nothing here can reach the internet or the host directly
  egress: {}

volumes:
  agent-home:
  agent-work:
  agent-state:
